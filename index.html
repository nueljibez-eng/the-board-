<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE BOARD</title><style>body{margin:0;background:#0b0d12;color:#fff;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;height:100vh;display:flex;flex-direction:column}.head{padding:20px;border-bottom:1px solid #252a35}.head b{font-size:20px}.head small{display:block;color:#9ca3af;margin-top:4px}.chat{flex:1;overflow:auto;padding:24px 16px}.msg{display:flex;margin:14px 0}.bubble{padding:13px 15px;border-radius:15px;white-space:pre-wrap;line-height:1.5;max-width:85%}.bot .bubble{background:#171b25}.user{justify-content:flex-end}.user .bubble{background:#30285f}.welcome{text-align:center;margin-top:18vh}.welcome h1{font-size:34px;margin-bottom:8px}.welcome p{color:#9ca3af}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{background:#171b25;border:1px solid #2b3140;color:#fff;padding:10px 12px;border-radius:20px}.form{display:flex;gap:8px;padding:14px 16px;border-top:1px solid #252a35}.input{flex:1;background:#171b25;color:#fff;border:1px solid #303747;border-radius:13px;padding:13px;outline:0}.send{background:#8b7cff;color:#fff;border:0;border-radius:13px;padding:0 18px;font-weight:700}.note{text-align:center;color:#697386;font-size:10px;padding-bottom:8px}</style></head><body><div class="app"><header class="head"><b>THE BOARD</b><small>Luna · Chief of Staff</small></header><main class="chat" id="chat"><div id="messages"><div class="welcome"><h1>What are we dealing with today?</h1><p>Tell Luna what is on your mind.</p><div class="chips"><button class="chip" onclick="use('I need help with my business.')">💼 Business</button><button class="chip" onclick="use('I have a relationship problem.')">❤️ Relationship</button><button class="chip" onclick="use('I need help with my spiritual life.')">🙏 Spiritual</button><button class="chip" onclick="use('I need help with personal development.')">🧠 Growth</button></div></div></div></main><form class="form" onsubmit="send(event)"><input id="input" class="input" placeholder="Talk to Luna..." autocomplete="off"><button class="send">Send</button></form><div class="note">AI advisors are inspired by public work and are not the real people.</div></div><script>function use(x){input.value=x;input.focus()}function add(role,text){let m=document.createElement('div');m.className='msg '+role;let b=document.createElement('div');b.className='bubble';b.textContent=text;m.appendChild(b);messages.appendChild(m);chat.scrollTop=chat.scrollHeight}function send(e){e.preventDefault();let x=input.value.trim();if(!x)return;document.querySelector('.welcome')?.remove();add('user',x);input.value='';setTimeout(()=>add('bot',route(x)),350)}function route(x){x=x.toLowerCase();let a=[];if(/pray|god|jesus|church|faith|spiritual/.test(x))a.push('🙏 Spiritual Advisor');if(/business|money|startup|profit|career|job/.test(x))a.push('💼 Business Advisor');if(/relationship|dating|love|girl|boy|breakup/.test(x))a.push('❤️ Relationship Advisor');if(/marriage|wife|husband|family/.test(x))a.push('💍 Marriage & Family Advisor');if(/discipline|purpose|goal|motivation|confidence|habit|growth/.test(x))a.push('🧠 Personal Development Advisor');if(/health|pain|sick|symptom|sleep|exercise|food/.test(x))a.push('🩺 Health Advisor');if(!a.length)a=['🤖 Luna'];return 'I’m bringing in:\n\n'+a.map(v=>'• '+v).join('\n')+'\n\nTell me the full situation and I’ll help you work through it. This first free version is the chat interface; the next layer connects the AI model so the advisors can generate live responses.'}</script></body></html>
